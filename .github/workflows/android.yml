name: Android and Functions CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  android:
    name: Android Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The v3 action defaults to the removed "tools" SDK package.
          packages: platform-tools

      - name: Install Android platform
        run: |
          # Android 17 publishes the SDK package as android-37.0, not android-37.
          sdkmanager "platforms;android-37.0"

      - name: Add Android 37 SDK compatibility alias
        run: |
          # Some Android Gradle Plugin tooling still resolves compileSdk 37 as android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

  functions:
    name: Firebase Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Functions dependencies
        run: npm install

      - name: Compile Firebase Functions
        run: npm run build

      - name: Run Firebase emulator security tests
        run: npm run test:rules
