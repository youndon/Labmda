name: Firebase Functions

on:
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/firebase-functions.yml"
  push:
    branches: [master]
    paths:
      - "functions/**"
      - ".github/workflows/firebase-functions.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm run build
