name: Firebase Functions CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "functions/**"
      - "firebase.test.json"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "functions/**"
      - "firebase.test.json"
      - ".github/workflows/functions-ci.yml"

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run Realtime Database and Firestore emulator tests
        run: npx --yes firebase-tools@14 emulators:exec --only database,firestore --project demo-labmda --config ../firebase.test.json "npm run test:emulator"
      - name: Build Firebase Functions
        run: npm run build
