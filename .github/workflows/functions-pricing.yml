name: Firebase Functions Pricing CI

on:
  push:
    branches: ["master"]
    paths: ["functions/**", "firebase.json", ".github/workflows/functions-pricing.yml"]
  pull_request:
    branches: ["master"]
    paths: ["functions/**", "firebase.json", ".github/workflows/functions-pricing.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
