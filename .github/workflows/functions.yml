name: Firebase Functions CI

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: RTDB transaction integration tests
        run: npx --yes firebase-tools@14 emulators:exec --only database --project demo-labmda --config ../firebase.test.json "npm run test:emulator"
      - name: TypeScript build
        run: npm run build
