name: Firebase Functions CI

on:
  pull_request:
    branches: [ "main", "master", "phase-04-cash-payments", "phase-05-server-payment-creation" ]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"
  push:
    branches: [ "main", "master", "phase-04-cash-payments", "phase-05-server-payment-creation" ]
    paths:
      - "functions/**"
      - ".github/workflows/functions.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: TypeScript build
        run: npm run build
